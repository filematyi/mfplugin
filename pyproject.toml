[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfpy"
version = "0.1.0"
description = "Standalone Tkinter interface for MfPlugin"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
mfpy = "mfpy.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mfpy*"]

[tool.setuptools.dynamic]
dependencies = { file = ["mfpy/requirements.txt"] }